g framework backend | `ai-service/requirements.txt:9` | [VERIFIED IN CODE] |\n| `faster-whisper` | `>=1.0.0` | Audio speech-to-text transcription engine | `ai-service/requirements.txt:10` | [VERIFIED IN CODE] |\n\n### 4. System Runtime & Tool Versions\n\n```\nCommand: node -v\nOutput: v24.19.0\n\nCommand: python --version\nOutput: Python 3.13.15\n\nCommand: ollama --version\nOutput: ollama version is 0.40.6\n```\n\n### 5. Registered Ollama Models (`ollama list`)\n\n```\nNAME                                      ID              SIZE      MODIFIED     \nmockmate-hr100:latest                     377c3b5ed931    3.4 GB    9 hours ago     \nmockmate:latest                           fc49d4f5b709    3.4 GB    20 hours ago    \nai-interview-assistant-llama-ft:latest    174faa587450    2.0 GB    4 days ago      \nmockmate-llama-ft:latest                  174faa587450    2.0 GB    2 weeks ago     \nllama3.2:3b                               a80c4f17acd5    2.0 GB    2 weeks ago     \nllama3:8b                                 365c0bd3c000    4.7 GB    6 weeks ago     \n```\n*(Source: command execution `ollama list`)* [MEASURED]\n\n### 6. Host Hardware Specifications\n\n| Hardware Attribute | Specification / Value | Measurement Command | Tag |\n| :--- | :--- | :--- | :--- |\n| **Operating System** | `Microsoft Windows 11 Home Single Language 10.0.26200` | `(Get-CimInstance Win32_OperatingSystem).Caption` | [MEASURED] |\n| **CPU Model** | `12th Gen Intel(R) Core(TM) i5-12450HX` (8 Cores, 12 Threads) | `(Get-CimInstance Win32_Processor).Name` | [MEASURED] |\n| **Physical RAM** | `15.71 GB` (~16 GB DDR4/DDR5) | `(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory` | [MEASURED] |\n| **Integrated GPU** | `Intel(R) UHD Graphics` | `(Get-CimInstance Win32_VideoController)` | [MEASURED] |\n| **Dedicated GPU** | `NVIDIA GeForce RTX 3050 6GB Laptop GPU` | `(Get-CimInstance Win32_VideoController)` | [MEASURED] |\n\n---\n\n## S4 Architecture and Data Flow\n\n### 1. Services Configuration\n\n| Service Name | Underlying Technology | Port | Directory Path | Start Command |\n| :--- | :--- | :---: | :--- | :--- |\n| **Frontend Web App** | React 18 + Vite | `3000` | `frontend/` | `npm run dev -- --port 3000` |\n| **Backend API Gateway** | Node.js Express (ESM) | `5000` | `backend/` | `node server.js` or `npm run dev` |\n| **AI Microservice** | Python 3.13 + FastAPI | `8000` | `ai-service/` | `python -m uvicorn app.main:app --host 0.0.0.0 --port 8000` |\n| **Model Server** | Ollama C++ Runner | `11434`| System service | `ollama serve` |\n| **Database Server** | MongoDB Community Server | `27017`| System service | `mongod` |\n\n### 2. Service Communication Channels\n- **Frontend $\\rightarrow$ Backend**: Configured by environment variable `VITE_API_URL` (default: `http://localhost:5000/api`). `frontend/src/services/api.js:6` [VERIFIED IN CODE]\n- **Backend $\\rightarrow$ AI Microservice**: Configured by environment variable `AI_SERVICE_URL` (default: `http://localhost:8000/api/ai`). `backend/services/aiService.js:3` [VERIFIED IN CODE]\n- **AI Microservice $\\rightarrow$ Ollama API**: Configured by environment variable `MODEL_ENDPOINT` (default: `http://localhost:11434/api/generate`). `ai-service/app/config.py:26` [VERIFIED IN CODE]\n\n---\n\n### 3. Step-by-Step Request Flows\n\n#### (a) Login Flow\n1. User enters email, password, and optional rememberMe flag on the frontend form (`frontend/src/pages/Login.jsx`).\n2. Frontend sends `POST http://localhost:5000/api/auth/login` (`frontend/src/services/api.js:82`).\n3. Express router passes request through `authRateLimiter` (`backend/routes/authRoutes.js:42`).\n4. Controller `loginUser` executes (`backend/controllers/authController.js:145`):\n   - Queries `User.findOne({ email }).select('+password')`.\n   - Checks `user.lockUntil`. If locked and time remaining, returns HTTP 423 `ACCOUNT_LOCKED`.\n   - Compares password using `user.matchPassword(password)` (`bcrypt.compare`).\n   - If mismatch: increments `user.failedLoginAttempts`. If attempts $\\ge 5$, sets `user.lockUntil = Date.now() + 15 * 60 * 1000`. Returns HTTP 401.\n   - If match: resets `failedLoginAttempts = 0`, generates access token (15m expiry) via `generateAccessToken(user._id)`.\n   - Generates random 40-byte refresh token, hashes it via `sha256()`, stores hash in `user.refreshTokenHash`, and sets HttpOnly cookie (`refreshToken`) on response.\n5. Frontend receives `{ success: true, accessToken, user }`, saves accessToken in memory and localStorage fallback, and redirects to `/dashboard`.\n\n#### (b) Starting an Interview Flow\n1. User selects stream (technical/hr), subject (java/dbms), difficulty (easy/medium/hard), format (theory/output_prediction/coding), and count on `frontend/src/pages/InterviewSetup.jsx`.\n2. Frontend invokes `createInterview(config)` sending `POST http://localhost:5000/api/interviews` (`frontend/src/services/api.js:156`).\n3. Express router guards route via `protect` middleware (`backend/routes/interviewRoutes.js:16`), extracting authenticated `req.user`.\n4. Controller `createInterview` (`backend/controllers/interviewController.js:14`) calls `generateNextQuestion()` (`backend/services/interviewEngine.js:29`).\n5. `interviewEngine.js` sends `POST http://localhost:8000/api/ai/generate-question` to FastAPI AI microservice (`backend/services/aiService.js:8`).\n6. FastAPI routes request to `generate_question` endpoint (`ai-service/app/routes/question_routes.py:22`), invoking `LlamaModel.generate_question()` (`ai-service/app/models/llama_provider.py:2100`).\n7. AI service generates question statement, expected concepts, and initial starter code / test cases, returning `QuestionResponse`.\n8. Backend creates new `Interview` record in MongoDB with `status: 'in-progress'` and stores the question payload in `currentQuestionData` (`backend/models/Interview.js:38`).\n9. Response `{ success: true, interview, question }` returned to frontend; browser transitions to `/interview/:id`.\n\n#### (c) HR Answer Submission and Evaluation Flow\n1. Candidate types or dictates answer and clicks \"Submit\" (`frontend/src/pages/Interview.jsx`).\n2. Frontend sends `POST http://localhost:5000/api/interviews/:id/answers` (`frontend/src/services/api.js:168`).\n3. Controller `submitAnswer` (`backend/controllers/interviewController.js:125`) retrieves active interview and forwards payload to AI service `POST http://localhost:8000/api/ai/evaluate-answer`.\n4. FastAPI routes to `evaluate_answer` (`ai-service/app/routes/evaluation_routes.py:8`), calling `_evaluate_hr_answer()` (`ai-service/app/models/llama_provider.py:3080`).\n5. **Deterministic Off-Topic Gate**: Calls `is_off_topic(question, answer)` (`ai-service/app/utils/hr_gate.py:86`).\n   - If answer matches 0 question topic keywords, immediately returns `score: 0`, `isIrrelevant: True`, bypassing model inference.\n6. If on-topic: computes BERT semantic similarity (`embedding_service.py`), formats prompt with STAR rubric guidelines, and invokes fine-tuned LLaMA model (`model_override=self.ft_model_name`) at temperature 0.0 (`llama_provider.py:3140`).\n7. Extracts metrics (`correctness`, `relevance`, `accuracy`, `communication`) and computes final overall score via `calculate_hr_overall()` (`ai-service/app/utils/hr_scoring.py:24`).\n8. AI service returns `EvaluationResponse`. Backend creates `Answer` document in MongoDB (`backend/models/Answer.js`).\n9. Increments `interview.attemptedCount`. If `attemptedCount >= questionsCount`, marks `interview.status = 'completed'` and generates aggregate `Result` record.\n10. Evaluation details and next question returned to frontend.\n\n#### (d) Java Coding Submission Flow\n1. Candidate writes Java method in the CodeWorkspace editor and clicks \"Run Tests\" or \"Submit Solution\".\n2. Request `POST /api/interviews/:id/answers` arrives at `interviewController.js:125`.\n3. Backend forwards `language: 'java'`, candidate code, and test cases array to AI service `POST /api/ai/evaluate-answer`.\n4. `llama_provider.py:3316` calls `execute_coding_submission()` in `ai-service/app/services/code_executor.py:292`.\n5. Code executor creates temporary isolated directory (`tempfile.mkdtemp()`).\n6. Generates `Solution.java` containing candidate code and compiles it via `javac -encoding UTF-8 Solution.java`.\n   - If compile fails: captures error string, sets `score = 0`, `compileError = stderr`.\n7. If compile succeeds: writes reflection runner `MockMateRunner.java` and executes each test case via `java -cp . MockMateRunner Solution <input>` under `timeout = 5.0s`.\n8. Compares stdout against `expectedOutput`, computing `passedCount` and `totalCount`.\n9. Concurrently, calls `_analyze_code_complexity()` (`llama_provider.py:3273`) invoking the fine-tuned model to deduce asymptotic Time and Space Big-O notation.\n10. Persists `Answer` document in MongoDB with `testCaseResults`, `timeComplexity`, `spaceComplexity`, and `score`.\n\n#### (e) SQL Coding Submission Flow\n1. Candidate writes SQL query and submits.\n2. Request reaches AI service `_evaluate_coding_answer()` with `language: 'sql'`.\n3. Calls `execute_sql_submission()` in `ai-service/app/services/code_executor.py:530`.\n4. Establishes in-memory SQLite database connection (`sqlite3.connect(\":memory:\")`).\n5. Executes DDL schema (`CREATE TABLE ...`) and inserts sample DML data.\n6. Executes reference solution query to extract expected row tuples and column headers.\n7. Executes candidate query to extract actual row tuples and column headers.\n8. Asserts row and column equivalence: if rows match exactly, `score = 100`, else `score = 0`.\n9. Closes SQLite in-memory connection and returns test result structure.\n\n#### (f) Code Complexity Analysis Flow\n1. Invoked automatically during coding evaluations or standalone analysis.\n2. Method `_analyze_code_complexity(question, code, lang)` executes (`ai-service/app/models/llama_provider.py:3273`).\n3. Formats prompt `build_training_style_prompt(\"analyze_code_complexity\", input_dict)` (`prompt_templates.py:88`).\n4. Selects model: `settings.FINE_TUNED_MODEL_NAME` (`mockmate-hr100` / `mockmate-llama-ft`).\n5. Invokes Ollama API at `temperature = 0.0`, `num_predict = 256`, `response_format = \"json\"`, `timeout = 45`.\n6. Extracts `timeComplexity` (e.g. `O(N)`), `spaceComplexity` (e.g. `O(1)`), and `explanation`.\n7. If call fails or output lacks Big-O notation, invokes `_estimate_code_complexity_heuristic(code)` regex fallback.\n\n---\n\n## S5 APIs\n\n### 1. Express Backend Routes (`backend/`)\n\n| Method | Path | Auth Required | Allowed Roles | Controller Function | File Location |\n| :--- | :--- | :---: | :---: | :--- | :--- |\n| `GET` | `/api/health` | No | Public | Inline lambda handler | `backend/server.js:41` |\n| `POST` | `/api/auth/register` | No (Rate limited) | Public | `registerUser` | `backend/routes/authRoutes.js:36` |\n| `GET` | `/api/auth/verify-email` | No | Public | `verifyEmail` | `backend/routes/authRoutes.js:37` |\n| `POST` | `/api/auth/verify-email` | No | Public | `verifyEmail` | `backend/routes/authRoutes.js:38` |\n| `POST` | `/api/auth/resend-verification` | No (Rate limited)| Public | `resendVerification` | `backend/routes/authRoutes.js:39` |\n| `POST` | `/api/auth/login` | No (Rate limited) | Public | `loginUser` | `backend/routes/authRoutes.js:42` |\n| `POST` | `/api/auth/refresh` | No (HttpOnly Cookie)| Public | `refreshToken` | `backend/routes/authRoutes.js:43` |\n| `POST` | `/api/auth/logout` | No | Public | `logoutUser` | `backend/routes/authRoutes.js:44` |\n| `POST` | `/api/auth/forgot-password` | No (Rate limited)| Public | `forgotPassword` | `backend/routes/authRoutes.js:47` |\n| `POST` | `/api/auth/verify-reset-code`| No (Rate limited)| Public | `verifyResetCode` | `backend/routes/authRoutes.js:48` |\n| `POST` | `/api/auth/reset-password` | No | Public | `resetPassword` | `backend/routes/authRoutes.js:49` |\n| `GET` | `/api/auth/me` | Yes (`protect`) | Authenticated User | `getMe` | `back nication: 0.0`, and skips LLM inference. `llama_provider.py:3088-3110` [VERIFIED IN CODE]\n\n### 2. Embedding Similarity\n- **Model Name:** `all-MiniLM-L6-v2` (`SentenceTransformer`). `ai-service/app/config.py:28` [VERIFIED IN CODE]\n- **Thresholds:**\n  - Off-topic confirmation threshold: `semantic_relevance < 0.45` triggers irrelevant fallback. `llama_provider.py:3181` [VERIFIED IN CODE]\n  - Score reason question alignment threshold: `threshold = 0.28`. `llama_provider.py:465` [VERIFIED IN CODE]\n- **Usage Locations:** `embedding_service.py:compute_similarity`, `rag_service.py:retrieve`, `llama_provider.py:_filter_feedback_items`. [VERIFIED IN CODE]\n\n### 3. HR Overall Score Formula\n- **Code from `ai-service/app/utils/hr_scoring.py:24-30`:**\n  ```python\n  def calculate_hr_overall(correctness, relevance, accuracy, communication) -> int:\n      \"\"\"\n      Average of the four factors as shown to the candidate, so the overall score\n      always equals the average of the four displayed percentages.\n      \"\"\"\n      percents = [_percent(v) for v in (correctness, relevance, accuracy, communication)]\n      return int(sum(percents) / len(percents) + 0.5)\n  ```\n- **Every Place a Score is Computed:**\n  1. HR Evaluation: `calculate_hr_overall(correctness, relevance, accuracy, communication)` in `hr_scoring.py:24` and `llama_provider.py:3208`. Arithmetic mean of the 4 whole percentages: `int(sum(percents) / 4 + 0.5)`. (Delivery metrics if provided adjust `communication` prior to averaging).\n  2. Theory Evaluation (Java/DBMS): `_calculate_text_score(relevance, correctness, concept_coverage, communication)` in `llama_provider.py:357-363,3053`. Arithmetic mean of the 4 whole percentages: `int(sum(percents) / 4 + 0.5)`. *(Note: legacy documentation and test comment in `test_evaluation_rules.py:192` cited a weighted breakdown `0.30*correctness + 0.30*coverage + 0.25*relevance + 0.15*communication`, but active code uses equal unweighted arithmetic mean)*.\n  3. Output Prediction: `score = 100 if is_exact_match else 0` in `llama_provider.py:3242`.\n  4. Coding Evaluation: `score = int(round((passed / total) * 100))` in `llama_provider.py:3345`.\n  5. Session Completion: `avg = Math.round(validScores.reduce((sum, s) => sum + s, 0) / validScores.length)` in `backend/controllers/interviewController.js:296`.\n  6. Final Result Query: `overallScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)` in `backend/controllers/resultController.js:46`.\n\n### 4. Complexity Heuristic Fallback Rules (`_estimate_code_complexity_heuristic`)\n- Sorting call regex: `r\"(Arrays\\.sort|Collections\\.sort|\\.sort\\()\"` $\\rightarrow$ Time: `O(N log N)`, explanation: `\"Dominated by sorting operation O(N log N).\"`. `llama_provider.py:254,266` [VERIFIED IN CODE]\n- Nested loops regex: `r\"(for|while)\\s*\\([^)]*\\)\\s*\\{[\\s\\S]*?(for|while)\\s*\\(\"` $\\rightarrow$ Time: `O(N^2)`, explanation: `\"Quadratic time complexity due to nested iteration over input elements.\"`. `llama_provider.py:257,269` [VERIFIED IN CODE]\n- Halving + loop regex: `r\"(>>\\s*1|/\\s*2|\\bmid\\b|\\bbinarySearch\\b)\"` + loop $\\rightarrow$ Time: `O(N log N)`. `llama_provider.py:271` [VERIFIED IN CODE]\n- Halving alone $\\rightarrow$ Time: `O(log N)`, explanation: `\"Logarithmic time complexity through repeated halving of the search space.\"`. `llama_provider.py:274` [VERIFIED IN CODE]\n- Single loop or recursion $\\rightarrow$ Time: `O(N)`, explanation: `\"Linear time complexity iterating through the input elements.\"`. `llama_provider.py:277` [VERIFIED IN CODE]\n- Otherwise $\\rightarrow$ Time: `O(1)`, explanation: `\"Constant time operations with no loops or recursive calls.\"`. `llama_provider.py:281` [VERIFIED IN CODE]\n- Space complexity: if `has_extra_space` (matches `new int[]`, `new ArrayList`, `new HashMap`, etc.) or recursion $\\rightarrow$ Space: `O(N)`, else `O(1)`. `llama_provider.py:263,284` [VERIFIED IN CODE]\n\n### 5. Output Prediction Normalization (`_canonical_output`)\n- **Code from `ai-service/app/models/llama_provider.py:1288-1294`:**\n  ```python\n  def _canonical_output(text: str) -> str:\n      \"\"\"\n      Predict-the-output comparison form. Exact match only: the one allowance is\n      line-ending style and leading/trailing whitespace (a stray trailing newline\n      isn't program output). Case, digits, punctuation and inner spacing all count.\n      \"\"\"\n      return (text or \"\").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n  ```\n\n### 6. SQL Schema Normalization (`_normalize_sql_schema`)\n- Strips markdown code blocks and handles dict-based column maps. If schema is passed as a JSON object, iterates `{ table_name: { col_name: col_type } }` and converts to `CREATE TABLE table_name (col_name TYPE, ...);`. `llama_provider.py:2520-2544` [VERIFIED IN CODE]\n\n### 7. Java Harness & Execution Constants (`code_executor.py`)\n- Maximum standard output capture: `MAX_OUTPUT_BYTES = 64 * 1024` (64 KB). `code_executor.py:16` [VERIFIED IN CODE]\n- Per-test case process timeout: `DEFAULT_TIMEOUT_SEC = 5.0` seconds. `code_executor.py:17` [VERIFIED IN CODE]\n- Harness Class Name: `MockMateRunner`. Uses Java reflection (`Class.forName`, `getDeclaredMethods`) to locate non-main public solver methods, invoke with parsed arguments, and print formatted outputs. `code_executor.py:48-93` [VERIFIED IN CODE]\n\n### 8. Topic Selector Catalog Sizes (`llama_provider.py`)\n- `_BUSINESS_DOMAINS`: 18 domains. `llama_provider.py:50-57` [VERIFIED IN CODE]\n- `_THEORY_TOPIC_FOCUS[\"java\"]`: 30 sub-topics. `llama_provider.py:60-91` [VERIFIED IN CODE]\n- `_THEORY_TOPIC_FOCUS[\"dbms\"]`: 30 sub-topics. `llama_provider.py:92-123` [VERIFIED IN CODE]\n- `_THEORY_TOPIC_FOCUS[\"hr\"]`: 15 sub-topics. `llama_provider.py:124-140` [VERIFIED IN CODE]\n- `_OUTPUT_PREDICTION_FOCUS[\"java\"]`: 15 pitfall categories. `llama_provider.py:151-167` [VERIFIED IN CODE]\n- `_OUTPUT_PREDICTION_FOCUS[\"dbms\"]`: 12 query ODEL_NAME` dynamically with `os.getenv(\"FINE_TUNED_MODEL_NAME\")`. |\n| `test_is_fine_tuned_verified_false_when_matches_any_stock_model` | `tests/test_model_config.py:134` | Test Mock Desynchronization: Mock tags response hardcoded `mockmate-llama-ft:latest`, but `LlamaModel` initialized with `settings.FINE_TUNED_MODEL_NAME` (`mockmate-hr100:latest`). | Connected mock model tag dynamically to `settings.FINE_TUNED_MODEL_NAME`. |\n| `test_is_fine_tuned_verified_true_when_distinct_and_modelfile_sha256_matches` | `tests/test_model_config.py:28` | Test Mock Desynchronization: Mock tags response hardcoded `mockmate-llama-ft:latest`, causing `check_connection()` to fail to match the fine-tuned model and fall back to verifying the base model. | Connected mock model tag dynamically to `settings.FINE_TUNED_MODEL_NAME`. |\n\n---\n\n## 2. Code Editor: Custom Native HTML `<textarea>` vs Monaco Editor\n* **Source:** `frontend/src/components/CodeWorkspace.jsx:185-208`\n* **Evidence:** The codebase contains **zero references** to Monaco Editor (`@monaco-editor/react` or `monaco-editor`) in `package.json`.\n* **Technical Architecture:**\n  1. `<div className=\"code-editor-gutter\" ref={gutterRef}>`: Renders line numbers dynamically based on code line splits.\n  2. `<textarea ref={textareaRef} className=\"code-editor-textarea\">`: Native HTML multiline input.\n  3. `syncScroll()`: Synchronizes `scrollTop` of gutter with textarea on scroll events.\n  4. `handleKeyDown()`: Intercepts `Tab` key, executes `e.preventDefault()`, and inserts 4 spaces at cursor position.\n  5. `handlePaste()`: Intercepts `Ctrl+V` to prevent pasting external code into mock interview rounds.\n\n---\n\n## 3. Complexity Fallback: Regex Heuristics vs Compiler AST\n* **Source:** `ai-service/app/models/llama_provider.py:243-288`\n* **Evidence:** The codebase does **not** invoke Java compiler AST parsers (such as `javaparser` or `tree-sitter`).\n* **Technical Architecture:**\n  * Regex `r\"(Arrays\\.sort|Collections\\.sort|\\.sort\\()\"` -> Time: O(N log N).\n  * Regex `r\"(for|while)\\s*\\([^)]*\\)\\s*\\{[\\s\\S]*?(for|while)\\s*\\(\"` -> Time: O(N^2).\n  * Regex `r\"(>>\\s*1|/\\s*2|\bmid\b|\bbinarySearch\b)\"` -> Time: O(log N).\n  * Regex `r\"(for|while)\\s*\\(\"` or recursive method invocation -> Time: O(N).\n  * Default if no patterns match -> Time: O(1).\n  * Memory allocation regex `r\"new\\s+(?:int|long|double|String|byte|char|boolean)\\s*\\[\"` -> Space: O(N).\n\n---\n\n## 4. Score Formulas Across All System Modules\n* **HR Behavioral Evaluation (`ai-service/app/utils/hr_scoring.py:24-30`):**\n  Unweighted arithmetic mean of four whole percentages:\n  ```python\n  def calculate_hr_overall(correctness, relevance, accuracy, communication) -> int:\n      percents = [_percent(v) for v in (correctness, relevance, accuracy, communication)]\n      return int(sum(percents) / len(percents) + 0.5)\n  ```\n  *(Delivery metrics, if present, apply a penalty directly to `communication` prior to averaging).*\n* **Theory Evaluation (`ai-service/app/models/llama_provider.py:357-363`):**\n  Unweighted arithmetic mean of four whole percentages:\n  ```python\n  def _calculate_text_score(relevance: float, correctness: float, concept_coverage: float, communication: float) -> int:\n      percents = [round(max(0.0, min(1.0, float(v))) * 100) for v in (relevance, correctness, concept_coverage, communication)]\n      return int(sum(percents) / len(percents) + 0.5)\n  ```\n* **Java Coding Problem Evaluation (`ai-service/app/services/code_executor.py:250`):**\n  Deterministic unit test pass ratio: `int(round((passed / total) * 100))`. Syntax error yields `0`.\n* **Output Prediction (`ai-service/app/models/llama_provider.py:3242`):**\n  Binary match: `100 if canonical(candidate) == canonical(expected) else 0`.\n* **Session Overall Score (`backend/controllers/interviewController.js:296`):**\n  Arithmetic mean of question scores: `Math.round(validScores.reduce((sum, s) => sum + s, 0) / validScores.length)`.\n\n---\n\n## 5. Standalone Evaluation Scripts (`C:\\mockmate_eval`)\n\n### (a) `real_answers_test.py`: 9/10 Passed & Architectural Finding\n* **Command:** `python real_answers_test.py` (in `C:\\mockmate_eval`)\n* **Verbatim Raw Output:**\n  ```\n  [PASS] expect high     score= 65 rel=1.0 irrelevant=False | Tell me about yourself. | I am a final year CSE student from Coimbatore....\n  [PASS] expect high     score= 65 rel=1.0 irrelevant=False | Why should we hire you? | I have hands-on Python and SQL experience from...\n  [PASS] expect zero     score=  0 rel=0.0 irrelevant=True  | Why should we hire you? | I went to Goa last month and the beaches were ...\n  [PASS] expect positive score= 65 rel=1.0 irrelevant=False | What is your notice period? | My notice period is 60 days, but my manager ha...\n  [CHECK] expect zero     score= 32 rel=1.0 irrelevant=False | What is your notice period? | I handled the conflict by listening to both si...\n  [PASS] expect positive score= 65 rel=1.0 irrelevant=False | Are you willing to relocate to another cit | Yes, I am open to relocating. I have lived in ...\n  [PASS] expect positive score= 43 rel=1.0 irrelevant=False | What are your salary expectations? | As a fresher I am looking for a package in lin...\n  [PASS] expect high     score= 65 rel=1.0 irrelevant=False | Tell me about a time you failed. | I failed my first mock interview because I ram...\n  [PASS] expect zero     score=  0 rel=0.0 irrelevant=True  | How do you handle stress? | Whatever....\n  [PASS] expect positive score= 37 rel=1.0 irrelevant=False | Where do you see yourself in five years? | In five years I want to grow into a senior dev...\n\n  9/10 as expected\n  ```\n* **Architectural Insight on Test Case 5:**\n  * When asked *\"What is your notice period?\"*, the candidate responded with a conflict-resolution answer (*\"I handled the conflict by listening to both sides and finding a compromise\"*).\n  * In `real_answers_test.py`, Ollama's raw `/api/chat` is called directly without application middleware. The raw model hallucinated `relevance=1.0` and awarded `32` points.\n  * In the active MockMate web application, `_evaluate_hr_answer` invokes `hr_gate.py:is_off_topic` **before** calling LLaMA. Because notice period questions require notice/joining keywords (`days`, `month`, `buyout`, `immediate`, `joining`, `offer`), the gate detects zero keyword hits and assigns **score 0 (`isIrrelevant: True`)** without calling LLaMA.\n  * **Conclusion for Final Report:** This proves that standalone LLM prompt evaluation is insufficient and validates MockMate's two-tier hybrid architecture (deterministic lexical gating + fine-tuned LLM scoring).\n\n---\n\n### (b) 100-Question Benchmark (`evaluate_hr100.py`): Sampling Rationale & Full Evidence\n* **Rule 8 Rationale:** Sequential execution against local Ollama requires **~7.3 seconds per question**. A full 100-question run requires **~730 seconds (12.2 minutes)**. Under Rule 8, representative sampled benchmarks were executed:\n\n#### 10-Row Benchmark Run (`python evaluate_hr100.py 10`):\n```\nusing a random sample of 10 rows\n10 validation rows covering 10 of 100 questions\n1/102/103/104/105/106/107/108/109/1010/10\nparsed 10, invalid JSON 0\nscore MAE: 5.0 points\nirrelevant answers correctly scored 0 : 3/3\nrelevant answers wrongly scored 0     : 0/7   (should be 0 or close)\nmodel output breaking the rule        : irrelevant but score>0 = 0, relevant but score<1 = 0\n5 questions with the largest score error:\n   18.0  What was your biggest academic challenge and how did you handle it?\n   18.0  Where are you from and how has your hometown shaped you?\n    8.0  Tell me about a time you took the lead on something.\n    5.0  How do you handle stress?\n    1.0  What can you contribute to our organisation in the first six months?\n```\n\n#### 5-Row Benchmark Run (`python evaluate_hr100.py 5`):\n```\nusing a random sample of 5 rows\n5 validation rows covering 5 of 100 questions\n1/52
